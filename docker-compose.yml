services:
  mlflow:
    build: ./docker/mlflow
    container_name: hotels-mlflow
    ports:
      - "5001:5000"
    volumes:
      - mlflow-store:/mlflow/store
      - mlflow-artifacts:/mlflow/artifacts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: hotels-api
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      HOTELS_DECISION_THRESHOLD: "0.5"
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz').read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ui:
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
    container_name: hotels-ui
    ports:
      - "8050:8050"
    environment:
      HOTELS_API_BASE: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mlflow-store:
  mlflow-artifacts:
