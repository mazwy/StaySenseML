services:
  mlflow:
    build: ./docker/mlflow
    container_name: hotels-mlflow
    ports:
      - "5001:5000"
    volumes:
      - mlflow-store:/mlflow/store
      - mlflow-artifacts:/mlflow/artifacts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mlflow-store:
  mlflow-artifacts:
